# Dependabot (GitHub-Blueprint, [dependabot] in .github/blueprint.toml)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "abhaengigkeiten"
    cooldown:
      default-days: 5
    groups:
      github_actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directories: ["/apis/escola", "/apis/_vorlage"]   # jede API hat ihre eigene requirements.txt
    schedule:
      interval: "weekly"
    labels:
      - "abhaengigkeiten"
    cooldown:
      default-days: 5
    groups:
      pip:
        patterns: ["*"]
