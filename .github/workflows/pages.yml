name: pages

# Testplattform (nur Oberfläche) auf GitHub Pages (#51). Die APIs laufen lokal; die Seite ruft sie direkt aus dem
# Browser auf. Einmalig: Settings → Pages → Source «GitHub Actions». Bei privatem Repo braucht Pages einen bezahlten Plan.
on:
  push:
    branches: [main]
    paths: ["testplattform/**", "apis/**", "shared/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      # Abhängigkeiten der APIs: für die statische Beschreibung (Doku) jeder API (manifeste/<name>.json)
      - run: for r in apis/*/requirements.txt; do pip install -q -r "$r"; done
      - run: python3 testplattform/pages_bauen.py _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
